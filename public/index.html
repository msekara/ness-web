<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ness Monitor</title>
<style>
  :root{
    --bg:#14171c; --panel:#1b1f26; --panel-2:#20252e; --line:#2b3138;
    --ink:#e6eaf0; --muted:#8592a3; --faint:#5a6675;
    --ok:#35c46b; --armed:#f2b13c; --alarm:#ff4d4d; --accent:#47c7d4;
    --ok-dim:#1d3a2a; --armed-dim:#3a2f14; --alarm-dim:#3a1717;
    --radius:10px; --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
    -webkit-font-smoothing:antialiased;line-height:1.45}
  .wrap{max-width:1180px;margin:0 auto;padding:20px 20px 60px}

  /* ---- header ---- */
  header{display:flex;align-items:center;gap:14px;padding:6px 2px 18px}
  .logo{font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:15px}
  .logo b{color:var(--accent)}
  .sub{color:var(--faint);font-size:12px;letter-spacing:.04em}
  .link{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;
    color:var(--muted);font-family:var(--mono)}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--faint)}
  .dot.up{background:var(--ok);box-shadow:0 0 0 0 rgba(53,196,107,.5);animation:pulse 2.4s infinite}
  .dot.down{background:var(--alarm)}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(53,196,107,.45)}70%{box-shadow:0 0 0 7px rgba(53,196,107,0)}100%{box-shadow:0 0 0 0 rgba(53,196,107,0)}}

  /* ---- signature: system state banner ---- */
  .banner{border-radius:var(--radius);border:1px solid var(--line);
    background:linear-gradient(180deg,var(--panel-2),var(--panel));
    padding:22px 24px;display:flex;align-items:center;gap:22px;position:relative;overflow:hidden}
  .banner::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--faint)}
  .banner .state{font-size:34px;font-weight:800;letter-spacing:.02em;line-height:1}
  .banner .detail{color:var(--muted);font-size:13px;margin-top:6px;letter-spacing:.02em}
  .banner .clock{margin-left:auto;text-align:right;font-family:var(--mono);color:var(--faint);font-size:12px}
  .banner.ok::before{background:var(--ok)} .banner.ok .state{color:var(--ok)}
  .banner.armed::before{background:var(--armed)} .banner.armed .state{color:var(--armed)}
  .banner.alarm{border-color:var(--alarm)} .banner.alarm::before{background:var(--alarm)}
  .banner.alarm .state{color:var(--alarm);animation:flash 1s steps(2,end) infinite}
  @keyframes flash{50%{opacity:.35}}

  /* ---- layout grid ---- */
  .cols{display:grid;grid-template-columns:1.15fr .85fr;gap:16px;margin-top:16px}
  @media(max-width:840px){.cols{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
  .card h2{margin:0 0 14px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--muted);font-weight:700}

  /* ---- zone LED grid ---- */
  .zones{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  @media(max-width:640px){.zones{grid-template-columns:repeat(2,1fr)}}
  .zone{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;
    padding:18px 16px;display:flex;align-items:center;gap:14px;transition:border-color .2s}
  .led{width:16px;height:16px;border-radius:50%;background:#39424e;flex:0 0 auto;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)}
  .zone .n{font-family:var(--mono);font-size:15px;color:var(--ink);font-weight:600}
  .zone .s{margin-left:auto;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
  .zone.sealed .led{background:var(--ok);box-shadow:0 0 6px rgba(53,196,107,.4)}
  .zone.sealed .s{color:var(--ok)}
  .zone.unsealed{border-color:#4a5361}
  .zone.unsealed .led{background:#cfd6df;box-shadow:0 0 8px rgba(207,214,223,.5)}
  .zone.unsealed .s{color:var(--ink)}
  .zone.excluded{opacity:.55}
  .zone.excluded .led{background:var(--faint);box-shadow:none}
  .zone.excluded .n{text-decoration:line-through}
  .zone.excluded .s{color:var(--muted)}
  .zone.alarm{border-color:var(--alarm);background:var(--alarm-dim)}
  .zone.alarm .led{background:var(--alarm);box-shadow:0 0 10px var(--alarm);animation:flash .8s steps(2,end) infinite}
  .zone.alarm .s{color:var(--alarm)}

  /* ---- chip lists ---- */
  .chips{display:flex;flex-wrap:wrap;gap:8px;min-height:20px}
  .chip{font-size:12px;padding:5px 10px;border-radius:20px;border:1px solid var(--line);
    background:var(--panel-2);color:var(--muted)}
  .chip.on{color:var(--ink)}
  .chip.arm{border-color:var(--armed);color:var(--armed)}
  .chip.alarm{border-color:var(--alarm);color:var(--alarm)}
  .chip.out{border-color:var(--accent);color:var(--accent)}
  .empty{color:var(--faint);font-size:12px;font-style:italic}
  .kv{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);
    padding:6px 0;border-top:1px solid var(--line)}
  .kv:first-of-type{border-top:none}
  .kv b{color:var(--ink);font-weight:600;font-family:var(--mono)}

  /* ---- command bar ---- */
  .cmd{margin-top:16px}
  .cmd .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .pad{display:grid;grid-template-columns:repeat(3,56px);gap:8px}
  .key{height:48px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);
    border-radius:8px;font-size:18px;font-family:var(--mono);cursor:pointer;transition:.12s}
  .key:hover{border-color:var(--accent);color:var(--accent)}
  .key:active{transform:translateY(1px)}
  .entry{flex:1;min-width:150px;display:flex;flex-direction:column;gap:8px}
  .display{font-family:var(--mono);font-size:22px;letter-spacing:.3em;background:#0e1116;
    border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-height:48px;color:var(--accent)}
  .btns{display:flex;gap:8px;flex-wrap:wrap}
  button.act{border:1px solid var(--line);background:var(--panel-2);color:var(--ink);
    padding:10px 14px;border-radius:8px;font-size:13px;cursor:pointer;font-weight:600;transition:.12s}
  button.act:hover{border-color:var(--accent)}
  button.act.arm:hover{border-color:var(--armed);color:var(--armed)}
  button.act.ok:hover{border-color:var(--ok);color:var(--ok)}
  button.act.danger:hover{border-color:var(--alarm);color:var(--alarm)}
  select.act{background:var(--panel-2);color:var(--ink);border:1px solid var(--line);
    padding:9px;border-radius:8px;font-size:12px}

  /* ---- logs ---- */
  .tabs{display:flex;gap:6px;margin-bottom:12px}
  .tab{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);
    background:none;border:none;cursor:pointer;padding:4px 2px;border-bottom:2px solid transparent}
  .tab.active{color:var(--ink);border-color:var(--accent)}
  .log{font-family:var(--mono);font-size:12px;max-height:280px;overflow:auto;line-height:1.7}
  .log .e{display:flex;gap:10px;padding:3px 0;border-bottom:1px solid #23282f}
  .log .t{color:var(--faint);flex:0 0 auto}
  .log .d{color:var(--ink)}
  .log .r{color:var(--faint)}
  .log .sys{color:var(--muted)}
  .hidden{display:none}
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="logo"><b>Ness</b> Monitor</div>
      <div class="sub" id="linkName">D8x / D16x ASCII interface</div>
    </div>
    <div class="link"><span class="dot" id="dot"></span><span id="linkState">connecting…</span></div>
  </header>

  <div class="banner" id="banner">
    <div>
      <div class="state" id="stateText">—</div>
      <div class="detail" id="stateDetail">Waiting for panel…</div>
    </div>
    <div class="clock"><div id="lastUpdate">no data yet</div></div>
  </div>

  <div class="cols">
    <div class="card">
      <h2>Zones</h2>
      <div class="zones" id="zones"></div>
    </div>

    <div>
      <div class="card">
        <h2>Arming</h2>
        <div class="chips" id="arming"></div>
      </div>
      <div class="card" style="margin-top:16px">
        <h2>Alarms &amp; Warnings</h2>
        <div class="chips" id="misc"></div>
      </div>
      <div class="card" style="margin-top:16px">
        <h2>Outputs</h2>
        <div class="chips" id="outputs"></div>
        <div class="chips" id="aux" style="margin-top:8px"></div>
      </div>
      <div class="card" style="margin-top:16px">
        <h2>Panel</h2>
        <div class="kv"><span>Model</span><b id="model">—</b></div>
        <div class="kv"><span>Firmware</span><b id="version">—</b></div>
        <div class="kv"><span>View state</span><b id="view">—</b></div>
        <div class="kv"><span>Link</span><b id="linkKv">—</b></div>
      </div>
    </div>
  </div>

  <div class="card cmd">
    <h2>Command</h2>
    <div class="row">
      <div class="pad" id="pad"></div>
      <div class="entry">
        <div class="display" id="display">&nbsp;</div>
        <div class="btns">
          <button class="act ok"     data-cmd="disarm">Disarm (code E)</button>
          <button class="act arm"    data-cmd="arm">Arm Away (A code E)</button>
          <button class="act arm"    data-cmd="home">Arm Home (H code E)</button>
          <button class="act"        data-cmd="send">Send keys (E)</button>
          <button class="act"        data-cmd="clear">Clear</button>
        </div>
        <div class="btns">
          <select class="act" id="statusSel"></select>
          <button class="act" data-cmd="status">Request status</button>
          <button class="act" data-cmd="refresh">Refresh all</button>
          <button class="act danger" data-cmd="panic">Panic</button>
        </div>
      </div>
    </div>
  </div>

  <div class="card" style="margin-top:16px">
    <div class="tabs">
      <button class="tab active" data-tab="events">Event log</button>
      <button class="tab" data-tab="serial">Serial / system</button>
    </div>
    <div class="log" id="events"></div>
    <div class="log hidden" id="serial"></div>
  </div>
</div>

<script>
// ---- client state (mirrors the server cache) ----
const S = { connected:false, link:'', updated:null, zoneCount:8, zones:{}, arming:[],
            misc:[], outputs:[], aux:[], view:null, model:null, version:null };

const STATUS_LABELS = {
  0:'Zones unsealed',1:'Radio unsealed',2:'CBus unsealed',3:'Zones in delay',
  4:'Double trigger',5:'Zones in alarm',6:'Excluded',7:'Auto excluded',
  8:'Superv. fail pending',9:'Superv. fail',10:'Doors open',11:'Detector low batt',
  12:'Detector tamper',13:'Misc alarms',14:'Arming',15:'Outputs',16:'View state',
  17:'Version',18:'Aux outputs'
};

// ---- websocket ----
let ws;
function connect(){
  ws = new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
  ws.onmessage = (ev)=>{
    const m = JSON.parse(ev.data);
    if(m.kind==='state'){ Object.assign(S,m.state); renderAll(); }
    else if(m.kind==='events'){ renderEvents(m.events); }
    else if(m.kind==='event'){ addEvent(m.event); }
    else if(m.kind==='log'){ addSerial(m.line); }
  };
  ws.onclose = ()=>{ setLink(false,'reconnecting…'); setTimeout(connect,2000); };
  ws.onopen  = ()=> setLink(S.connected, S.connected?'live':'link down');
}
function send(obj){ if(ws&&ws.readyState===1) ws.send(JSON.stringify(obj)); }

// ---- rendering ----
function setLink(up,label){
  S.connected=up;
  const dot=document.getElementById('dot');
  dot.className='dot '+(up?'up':'down');
  document.getElementById('linkState').textContent=label||(up?'live':'link down');
}

function renderAll(){
  document.getElementById('linkName').textContent=S.link||'D8x / D16x ASCII interface';
  document.getElementById('linkKv').textContent=S.link||'—';
  setLink(S.connected);
  renderBanner(); renderZones(); renderChips(); renderPanel();
  document.getElementById('lastUpdate').textContent = S.updated
    ? 'updated '+new Date(S.updated).toLocaleTimeString() : 'no data yet';
}

function renderBanner(){
  const b=document.getElementById('banner');
  const alarmZones=S.zones[5]||[];
  const hasAlarm = alarmZones.length>0 ||
    (S.misc||[]).some(f=>/Fire|Panic|Medical|Duress|Tamper/.test(f)) ||
    (S.outputs||[]).some(f=>/Siren/.test(f));
  const entry=(S.arming||[]).some(f=>/Entry Delay/.test(f));
  const armedFlags=(S.arming||[]).filter(f=>/Armed/.test(f));
  let cls='ok', text='DISARMED', detail='All areas disarmed';
  if(hasAlarm){ cls='alarm'; text='ALARM';
    detail=[alarmZones.length?('zones '+alarmZones.join(', ')):null, ...(S.misc||[])].filter(Boolean).join(' · ')||'Alarm condition';
  } else if(entry){ cls='armed'; text='ENTRY DELAY'; detail='Entry timer running — disarm now'; }
  else if(armedFlags.length){ cls='armed'; text='ARMED'; detail=armedFlags.join(' · '); }
  if(!S.connected && !S.updated){ cls=''; text='—'; detail='Waiting for panel…'; }
  b.className='banner '+cls;
  document.getElementById('stateText').textContent=text;
  document.getElementById('stateDetail').textContent=detail;
}

function renderZones(){
  const unsealed=new Set(S.zones[0]||[]);
  const alarm=new Set(S.zones[5]||[]);
  const excl=new Set([...(S.zones[6]||[]),...(S.zones[7]||[])]);
  const el=document.getElementById('zones'); el.innerHTML='';
  const count=S.zoneCount||16;
  for(let n=1;n<=count;n++){
    let cls='sealed', s='sealed';
    if(alarm.has(n)){cls='alarm';s='alarm';}
    else if(excl.has(n)){cls='excluded';s='excl';}
    else if(unsealed.has(n)){cls='unsealed';s='open';}
    const d=document.createElement('div');
    d.className='zone '+cls;
    d.innerHTML=`<span class="led"></span><span class="n">Z${String(n).padStart(2,'0')}</span><span class="s">${s}</span>`;
    el.appendChild(d);
  }
}

function chipList(id, items, klass){
  const el=document.getElementById(id);
  if(!items||!items.length){ el.innerHTML='<span class="empty">none</span>'; return; }
  el.innerHTML=items.map(t=>`<span class="chip on ${klass||''}">${t}</span>`).join('');
}
function renderChips(){
  chipList('arming',S.arming,'arm');
  chipList('misc',S.misc,'alarm');
  chipList('outputs',S.outputs,'out');
  chipList('aux',S.aux,'out');
}
function renderPanel(){
  document.getElementById('model').textContent=S.model||'—';
  document.getElementById('version').textContent=S.version||'—';
  document.getElementById('view').textContent=S.view||'—';
}

// ---- event / serial logs ----
function fmt(t){ try{return new Date(t).toLocaleTimeString();}catch{return t;} }
function esc(s){ return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function addEvent(rec){
  const box=document.getElementById('events');
  const e=document.createElement('div'); e.className='e';
  e.innerHTML=`<span class="t">${fmt(rec.at||rec.recvAt||Date.now())}</span>`+
              `<span class="d">${esc(rec.description||rec.eventName||'')}</span>`;
  box.prepend(e);
  while(box.children.length>300) box.lastChild.remove();
}
function renderEvents(events){
  const box=document.getElementById('events'); box.innerHTML='';
  (events||[]).slice().reverse().forEach(addEvent); // oldest first -> newest ends on top
}
function addSerial(line){
  const box=document.getElementById('serial');
  const e=document.createElement('div'); e.className='e';
  e.innerHTML=`<span class="sys">${line}</span>`;
  box.prepend(e);
  while(box.children.length>400) box.lastChild.remove();
}

// ---- keypad + commands ----
let entry='';
const disp=document.getElementById('display');
function draw(){ disp.textContent = entry ? entry.replace(/./g,'•') : '\u00a0'; }
const pad=document.getElementById('pad');
['1','2','3','4','5','6','7','8','9','*','0','#'].forEach(k=>{
  const b=document.createElement('button'); b.className='key'; b.textContent=k;
  b.onclick=()=>{ entry+=k; draw(); }; pad.appendChild(b);
});
document.addEventListener('keydown',(e)=>{
  if(/^[0-9*#]$/.test(e.key)){ entry+=e.key; draw(); }
  else if(e.key==='Backspace'){ entry=entry.slice(0,-1); draw(); }
  else if(e.key==='Enter'){ send({action:'keypad',keys:entry+'E'}); }
});

const sel=document.getElementById('statusSel');
Object.entries(STATUS_LABELS).forEach(([id,label])=>{
  const o=document.createElement('option'); o.value=id; o.textContent=`${id} — ${label}`; sel.appendChild(o);
});

document.querySelector('.cmd').addEventListener('click',(e)=>{
  const c=e.target.getAttribute('data-cmd'); if(!c) return;
  if(c==='clear'){ entry=''; draw(); return; }
  if(c==='arm'){ send({action:'arm',code:entry}); }
  else if(c==='home'){ send({action:'home',code:entry}); }
  else if(c==='disarm'){ send({action:'disarm',code:entry}); }
  else if(c==='send'){ send({action:'keypad',keys:entry+'E'}); }
  else if(c==='status'){ send({action:'status',id:Number(sel.value)}); return; }
  else if(c==='refresh'){ send({action:'refresh'}); return; }
  else if(c==='panic'){ if(confirm('Trigger keypad PANIC on the panel?')) send({action:'panic'}); return; }
  entry=''; draw();
});

// ---- tabs ----
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');
  const tab=t.getAttribute('data-tab');
  document.getElementById('events').classList.toggle('hidden',tab!=='events');
  document.getElementById('serial').classList.toggle('hidden',tab!=='serial');
});

draw(); connect();
</script>
</body>
</html>
